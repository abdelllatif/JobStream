services:
  postgres:
    image: postgres:16-alpine
    container_name: jobstream_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  app:
    build: .
    container_name: jobstream_app
    env_file:
      - .env
    environment:
      APP_PORT: "8081"
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "${APP_EXPOSE_PORT:-8081}:8081"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      backend_net:
        aliases:
          - jobstream-api
      frontend_net:
        aliases:
          - jobstream-api

volumes:
  postgres_data:
  uploads_data:

networks:
  backend_net:
    driver: bridge
  frontend_net:
    name: ${FRONTEND_NETWORK_NAME:-jobstream_frontend_net}
    driver: bridge
