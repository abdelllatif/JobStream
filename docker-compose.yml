version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobstream_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-jobstream}
      POSTGRES_USER: ${DB_USERNAME:-jobstream_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobstream_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobstream_user} -d ${DB_NAME:-jobstream}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobstream_net

  app:
    build: .
    container_name: jobstream_app
    env_file:
      - .env
    environment:
      DB_HOST: postgres
