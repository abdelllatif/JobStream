server:
  port: ${APP_PORT:8081}

spring:
  application:
    name: JobStream

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobstream}
    username: ${DB_USERNAME:jobstream_user}
    password: ${DB_PASSWORD:jobstream_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  mvc:
    pathmatch:
      use-suffix-pattern: false

application:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  oauth2:
    redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:4200/oauth2/callback}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  file:
    storage-path: ${FILE_STORAGE_PATH:./uploads}
    base-url: ${FILE_BASE_URL:http://localhost:8081/uploads}

logging:
  level:
    com.Jobstream: DEBUG
    org.springframework.security: INFO
    org.springframework.web.socket: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
