name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-analyze-test:
    name: Build, Test, Analyze and Liquibase
    runs-on: ubuntu-latest
    
    # We set up a PostgreSQL service to provide a database for tests and liquibase
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobstream
          POSTGRES_USER: jobstream_user
          POSTGRES_PASSWORD: jobstream_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Make Maven Wrapper Executable
      run: chmod +x ./mvnw

    - name: Run Code Analysis (Checkstyle / PMD / Sonar - Placeholder)
      # If you use SonarQube, uncomment the line below and add your secrets:
      # run: ./mvnw verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=my-project -Dsonar.login=${{ secrets.SONAR_TOKEN }}
      run: echo "Static Analysis phase executed."

    - name: Database Migrations (Liquibase Validate)
      # Validates liquibase changelogs to ensure they are valid.
      # You can also use liquibase:update if you want it to run directly on the GitHub Actions DB.
      run: ./mvnw liquibase:updateSQL
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jobstream
        SPRING_DATASOURCE_USERNAME: jobstream_user
        SPRING_DATASOURCE_PASSWORD: jobstream_password

    - name: Run Tests (includes automatic Liquibase update via Spring Boot)
      run: ./mvnw test
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: jobstream
        DB_USERNAME: jobstream_user
        DB_PASSWORD: jobstream_password
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jobstream
        SPRING_DATASOURCE_USERNAME: jobstream_user
        SPRING_DATASOURCE_PASSWORD: jobstream_password

    - name: Build Application Package
      run: ./mvnw clean package -DskipTests

    - name: Upload Artifact (Optional)
      uses: actions/upload-artifact@v4
      with:
        name: jobstream-app
        path: target/*.jar
        retention-days: 5
