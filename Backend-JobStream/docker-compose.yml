services:
  postgres:
    image: postgres:15
    container_name: jobstream-postgres
    environment:
      POSTGRES_DB: jobstream
      POSTGRES_USER: jobstream
      POSTGRES_PASSWORD: jobstream123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jobstream-network

  backend:
    container_name: jobstream-backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobstream
      DB_USER: jobstream
      DB_PASSWORD: jobstream123

      JWT_SECRET: your-super-secret-jwt-key-for-jobstream-2024-change-this-in-production
      LIQUIBASE_CHANGELOG: classpath:db/changelog/db.changelog-master.yaml
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8080/api/oauth2/success
      PAYPAL_CLIENT_ID: test-paypal-client-id
      PAYPAL_CLIENT_SECRET: test-paypal-client-secret
      PAYPAL_MODE: sandbox
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: test-email@gmail.com
      MAIL_PASSWORD: test-email-password
      SERVER_PORT: 8080
      WEBSOCKET_ALLOWED_ORIGINS: http://localhost:4200
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:3000

    ports:
      - "8082:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - jobstream-network

volumes:
  postgres_data:
    driver: local

networks:
  jobstream-network:
    driver: bridge
